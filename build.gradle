// Root build — minimal shared conventions.
//
// Source containers (:common, :fabric, :neoforge) have compileJava disabled;
// they exist only so version builds can reference their src dirs.
//
// Version builds (e.g. :mc1_21_9_11-fabric) manage their own plugins, toolchain,
// and Java release target — DO NOT set a global toolchain here because MC 26.1
// requires Java 25 while MC 1.20.1 targets Java 17 bytecode.

subprojects {
    group = project.maven_group

    repositories {
        mavenCentral()
        maven { name = 'Mojang';   url = 'https://libraries.minecraft.net/' }
        maven { name = 'Fabric';   url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases' }
    }
}
