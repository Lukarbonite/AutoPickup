# Runs the Gradle daemon on Java 25 whatever JAVA_HOME is: RetroFuturaGradle (the 1.12.2 build)
# is compiled for Java 25, and Gradle loads it while configuring every project.
# Uses a locally installed JDK 25; regenerate with ./gradlew updateDaemonJvm --jvm-version=25 to add download URLs.
toolchainVersion=25
