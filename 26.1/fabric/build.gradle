// MC 26.1 — Fabric, unobfuscated (no remapping), Java 25
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "${mod_version}+${minecraft_version}"

base {
    archivesName = "${archives_base_name}-fabric"
}

repositories {
    mavenLocal()
    maven { name = "Terraformers"; url = "https://maven.terraformersmc.com/" }
    maven { name = "Xander Maven";  url = "https://maven.isxander.dev/releases" }
}

loom {
    noIntermediateMappings()
    mixin {
        defaultRefmapName = "autopickup.refmap.json"
    }
}

sourceSets {
    main {
        java {
            srcDirs += [
                project(':common').file('src/main/java'),
                file('../src/main/java')
            ]
        }
        resources {
            srcDirs += [
                file('../src/main/resources')
            ]
        }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release  = 25
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // MC 26.1 is unobfuscated — use implementation, not modImplementation
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    compileOnly "dev.isxander:yet-another-config-lib:${yacl_version}"

    compileOnly(files("${rootProject.projectDir}/libs/26.1.2/veinminer-fabric-2.8.2.jar"))
    compileOnly(files("${rootProject.projectDir}/libs/26.1.2/veinminer-common-2.8.2.jar"))
    compileOnly(files("${rootProject.projectDir}/libs/26.1.2/treeharvester-26.1.2-9.4.jar"))
    compileOnly(files("${rootProject.projectDir}/libs/26.1.2/travelersbackpack-fabric-26.1.2-11.2.6.jar"))
    compileOnly(files("${rootProject.projectDir}/libs/26.1.2/FallingTree-26.1.2-25.jar"))
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand version: inputs.properties.version
    }
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${archives_base_name}-fabric"
            from components.java
        }
    }
}
