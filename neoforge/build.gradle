plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${neoforge_gradle_version}"
}

base {
    archivesName = "${project.archives_base_name}-neoforge"
}

// Source-only container for NeoForge-specific code (entry points, events, compat).
// Version builds compile this via:  srcDirs += project(':neoforge').file('src/main/java')
// Version-specific metadata (neoforge.mods.toml) lives in each MC version's directory.
compileJava.enabled = false
jar.enabled = false

// moddev is applied here ONLY to give IDEs a Minecraft + NeoForge classpath
// for code insight in neoforge/src. Pinned to 26.1.2. Actual compilation
// always happens in the version projects via srcDirs +=, against each
// version's own Minecraft + NeoForge.
neoForge {
    version = '26.1.2.50-beta'
}
