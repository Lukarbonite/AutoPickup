// :neoforge — NeoForge-specific entry points and event registrations.
// Uses ModDevGradle (net.neoforged.moddev) — update neoforge_version in gradle.properties
// once NeoForge releases for the target Minecraft version.
plugins {
    id 'net.neoforged.moddev' version "${neoforge_gradle_version}"
    id 'maven-publish'
}

base {
    archivesName = "${project.archives_base_name}-neoforge"
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client() // Tells it to run the client

            // Optional: Add your mod's ID to the arguments if it's not picking up the source
            systemProperty 'neoforge.enabledGameTestNamespaces', project.archives_base_name
        }

        server {
            server() // Tells it to run a dedicated server
        }
    }

    mods {
        "autopickup" {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

repositories {
    maven { name = "Xander Maven";  url = "https://maven.isxander.dev/releases" }
}

dependencies {
    implementation project(':common')

    compileOnly "dev.isxander:yet-another-config-lib:${yacl_version}"

    compileOnly(files("../libs/veinminer-neoforge-2.8.2.jar"))
    compileOnly(files("../libs/treeharvester-26.1.2-9.4.jar"))
    compileOnly(files("../libs/travelersbackpack-neoforge-26.1.2-11.2.4.jar"))
    compileOnly(files("../libs/FallingTree-26.1.2-25.jar"))
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':common').sourceSets.main.output
    from project(':common').sourceSets.main.resources
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':common').sourceSets.main.output
    from project(':common').sourceSets.main.resources
}

processResources {
    var replaceProperties = [
            version          : project.mod_version,
            minecraft_version: project.minecraft_version,
            neoforge_version : project.neoforge_version
    ]

    inputs.properties replaceProperties

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    filesMatching("META-INF/neoforge.mods.toml") {
        expand replaceProperties
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${project.archives_base_name}-neoforge"
            from components.java
        }
    }
}
