// :neoforge — NeoForge-specific entry points and event registrations.
// Uses ModDevGradle (net.neoforged.moddev) — update neoforge_version in gradle.properties
// once NeoForge releases for the target Minecraft version.
plugins {
    id 'net.neoforged.moddev' version "${neoforge_gradle_version}"
    id 'maven-publish'
}

base {
    archivesName = "${project.archives_base_name}-neoforge"
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client() // Tells it to run the client

            // Optional: Add your mod's ID to the arguments if it's not picking up the source
            systemProperty 'neoforge.enabledGameTestNamespaces', project.archives_base_name
        }

        server {
            server() // Tells it to run a dedicated server
        }
    }

    mods {
        "autopickup" {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

dependencies {
    implementation project(':common')
}

processResources {
    inputs.property "version",           project.mod_version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "neoforge_version",  project.neoforge_version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand version:           project.mod_version,
                minecraft_version: project.minecraft_version,
                neoforge_version:  project.neoforge_version
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${project.archives_base_name}-neoforge"
            from components.java
        }
    }
}
