// MC 1.21.9-11 — Fabric, Mojang mappings, Java 21
plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = "${mod_version}+${mc_version_range}"

base {
    archivesName = "${archives_base_name}-fabric"
}

repositories {
    mavenLocal()
    maven { name = "Terraformers"; url = "https://maven.terraformersmc.com/" }
    maven { name = "Xander Maven";  url = "https://maven.isxander.dev/releases" }
}

loom {
    mixin {
        defaultRefmapName = "autopickup.refmap.json"
    }
}

sourceSets {
    main {
        java {
            srcDirs += [
                project(':common').file('src/main/java'),
                file('../src/main/java'),
                project(':fabric').file('src/main/java')
            ]
        }
        resources {
            srcDirs += [
                project(':common').file('src/main/resources'),
                file('../src/main/resources'),
                project(':fabric').file('src/main/resources')
            ]
        }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release  = 21
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    modCompileOnly "dev.isxander:yet-another-config-lib:${yacl_version}"

    modCompileOnly(files("${rootProject.projectDir}/libs/1.21.9-11/veinminer-fabric-2.10.1+1.21.11.jar"))
    modCompileOnly(files("${rootProject.projectDir}/libs/1.21.9-11/treeharvester-1.21.11-9.3.jar"))
    modCompileOnly(files("${rootProject.projectDir}/libs/1.21.9-11/travelersbackpack-fabric-1.21.11-10.11.9.jar"))
    modCompileOnly(files("${rootProject.projectDir}/libs/1.21.9-11/fallingtrees-fabric-1.21.11-0.14.0.jar"))
    modCompileOnly(files("${rootProject.projectDir}/libs/1.21.9-11/pandalib-fabric-1.21.11-0.6.0.jar"))
    modCompileOnly(files("${rootProject.projectDir}/libs/1.21.9-11/FallingTree-1.21.11-1.21.11.3.jar"))
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand version: inputs.properties.version
    }
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${archives_base_name}-fabric"
            from components.java
        }
    }
}
