plugins {
    id 'java-library'
}

base {
    archivesName = "${project.archives_base_name}-core"
}

// Minecraft-free logic shared by every version, 1.12.2 included (config, overrides, setting
// resolution, sessions, XP cache, loot splitting, command behavior). Version builds compile it
// via:  srcDirs += rootProject.file('core/src/main/java')
//
// Unlike the other source containers, this one does compile on its own: there is no Minecraft on
// its classpath, so a stray Minecraft import fails here instead of in only some versions. Gson and
// log4j are pinned to what 1.12.2 ships, the oldest runtime core has to run on.
jar.enabled = false

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release  = 8
}

dependencies {
    compileOnly 'com.google.code.gson:gson:2.8.0'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.8.1'
}
