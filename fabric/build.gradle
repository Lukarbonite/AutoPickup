// :fabric — Fabric-specific entry points, events, and client UI.
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

base {
    archivesName = "${project.archives_base_name}"
}

repositories {
    mavenLocal()
    maven { name = "Terraformers"; url = "https://maven.terraformersmc.com/" }
    maven { name = "Xander Maven";  url = "https://maven.isxander.dev/releases" }
}

loom {
    noIntermediateMappings()

    mixin {
        defaultRefmapName = "autopickup.refmap.json"
    }
}

sourceSets {
    main {
        java {
            // This "borrows" the source code from :common so it's compiled
            // directly into the Fabric mod.
            srcDirs += [
                    project(':common').file('src/main/java')
            ]
        }
        resources {
            // This ensures your mixin JSONs and assets from common are included.
            srcDirs += [
                    project(':common').file('src/main/resources')
            ]
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    include project(':common')

    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    compileOnly "dev.isxander:yet-another-config-lib:${yacl_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand version: inputs.properties.version
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
