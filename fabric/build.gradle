// :fabric — Fabric-specific entry points, events, and client UI.
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

base {
    archivesName = "${project.archives_base_name}"
}

repositories {
    mavenLocal()
    maven { name = "Terraformers"; url = "https://maven.terraformersmc.com/" }
    maven { name = "Xander Maven";  url = "https://maven.isxander.dev/releases" }
}

loom {
    mixin {
        useLegacyMixinAp = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings  loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Pull compiled :common classes into this jar (no transitive deps)
    implementation(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    // Bundle :common into the final Fabric jar so it ships as one file
    include project(':common')

    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    compileOnly "dev.isxander:yet-another-config-lib:${yacl_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand version: inputs.properties.version
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
