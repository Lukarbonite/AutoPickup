plugins {
    id 'com.gradleup.shadow'
}

loom {
    mixin.defaultRefmapName = "autopickup-fabric-refmap.json"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { name = "Terraformers"; url = "https://maven.terraformersmc.com/" }
    maven { name = "Xander Maven";  url = "https://maven.isxander.dev/releases" }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modCompileOnly "dev.isxander:yet-another-config-lib:${yacl_version}-fabric"

    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    modCompileOnly(files("../libs/Veinminer-2.0.7.jar"))
    modCompileOnly(files("../libs/treeharvester-1.20.1-9.1.jar"))
    modCompileOnly(files("../libs/FallingTree-1.20.1-4.3.4.jar"))
    modCompileOnly(files("../libs/fallingtrees-fabric-1.20.1-0.14.0.jar"))
    modCompileOnly(files("../libs/pandalib-fabric-1.20.1-0.6.1.jar"))
    modCompileOnly(files("../libs/cardinal-components-base-5.2.3.jar"))
    modCompileOnly(files("../libs/cardinal-components-entity-5.2.3.jar"))
    modCompileOnly(files("../libs/travelersbackpack-fabric-1.20.1-9.1.52.jar"))
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    mergeServiceFiles()

    manifest.inheritFrom project.tasks.jar.manifest
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

loom {
    mixin {
        useLegacyMixinAp = true
    }
}