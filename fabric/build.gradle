// :fabric — Fabric-specific entry points, events, and client UI.
plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

base {
    archivesName = "${project.archives_base_name}-fabric"
}

repositories {
    mavenLocal()
    maven { name = "Terraformers"; url = "https://maven.terraformersmc.com/" }
    maven { name = "Ladysnake"; url = "https://maven.ladysnake.org/releases" }
    maven { name = "Xander Maven"; url = "https://maven.isxander.dev/releases" }
}

sourceSets {
    main {
        java {
            srcDirs += [project(':common').file('src/main/java')]
        }
        resources {
            srcDirs += [project(':common').file('src/main/resources')]
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    modCompileOnly "dev.isxander:yet-another-config-lib:${yacl_version}"
    modCompileOnly(files("../libs/veinminer-fabric-2.4.2.jar"))
    modCompileOnly(files("../libs/treeharvester-1.21.1-9.1.jar"))
    modCompileOnly(files("../libs/travelersbackpack-fabric-1.21.1-10.1.19.jar"))
    compileOnly("org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.1")
    compileOnly("org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.1")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand version: inputs.properties.version
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
