plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        mixinConfig "autopickup.mixins.json"
        mixinConfig "autopickup.compat.mixins.json"
        mixinConfig "autopickup.forge.mixins.json"
    }

    mixin.defaultRefmapName = "autopickup-forge-refmap.json"
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    mavenCentral()
    maven { name = "Xander Maven";  url = "https://maven.isxander.dev/releases" }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // Gives the annotations (@WrapOperation) during compile
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.3"))
    // Makes it available at runtime in development
    // Loom translates "include" into Forge's Jar-in-Jar system automatically
    implementation(include("io.github.llamalad7:mixinextras-forge:0.5.3"))

    modCompileOnly "dev.isxander:yet-another-config-lib:${yacl_version}-forge"

    modCompileOnly(files("../libs/treeharvester-1.20.1-9.1.jar"))
    modCompileOnly(files("../libs/travelersbackpack-forge-1.20.1-9.1.54.jar"))
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    mergeServiceFiles()

    manifest.inheritFrom project.tasks.jar.manifest
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

loom {
    mixin {
        useLegacyMixinAp = true
    }
}